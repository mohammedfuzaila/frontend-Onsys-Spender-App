<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Deep dark background -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F0A1E"/>
      <stop offset="100%" stop-color="#160B2E"/>
    </linearGradient>
    <!-- Vivid purple bolt gradient -->
    <linearGradient id="bolt-grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C77DFF"/>
      <stop offset="40%" stop-color="#9B5DE5"/>
      <stop offset="100%" stop-color="#5A0FA0"/>
    </linearGradient>
    <!-- Inner gloss on bolt -->
    <linearGradient id="bolt-gloss" x1="40" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft drop shadow for text -->
    <filter id="text-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#7B2FFF" flood-opacity="0.7"/>
    </filter>
    <!-- Circular clip -->
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="96"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#bg-grad)" stroke="#3A1570" stroke-width="1.5"/>

  <!-- Subtle radial glow behind bolt -->
  <radialGradient id="center-glow" cx="50%" cy="45%" r="40%">
    <stop offset="0%" stop-color="#7B2FFF" stop-opacity="0.4"/>
    <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0"/>
  </radialGradient>
  <circle cx="100" cy="88" r="55" fill="url(#center-glow)" clip-path="url(#circle-clip)"/>

  <!-- Lightning bolt — scaled and centered -->
  <g filter="url(#glow)" clip-path="url(#circle-clip)">
    <!-- Main bolt shape -->
    <path
      d="M113 22 L60 98 L90 98 L87 178 L140 102 L110 102 Z"
      fill="url(#bolt-grad)"
    />
    <!-- Glossy sheen on bolt -->
    <path
      d="M113 22 L60 98 L90 98 L87 178 L140 102 L110 102 Z"
      fill="url(#bolt-gloss)"
    />
  </g>
</svg>